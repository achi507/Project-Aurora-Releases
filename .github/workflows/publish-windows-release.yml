name: Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Aurora version without the leading v
        required: true
        default: 1.5.0

permissions:
  contents: write

concurrency:
  group: public-windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish public Windows release
    runs-on: windows-latest
    steps:
      - name: Check out release channel
        uses: actions/checkout@v4

      - name: Validate version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-(?:beta|rc)(?:\.\d+)?)?$') {
            throw "Invalid Aurora version: $version"
          }
          "AURORA_VERSION=$version" >> $env:GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: false

      - name: Install Windows build tools
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          choco install nsis --yes --no-progress

      - name: Download exact source snapshot
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $seed = Join-Path $env:RUNNER_TEMP 'aurora-source-seed'
          New-Item -ItemType Directory -Force -Path $seed | Out-Null
          gh release download "v$env:AURORA_VERSION" `
            --repo '${{ github.repository }}' `
            --pattern "Aurora-$env:AURORA_VERSION-Source.zip" `
            --dir $seed
          Expand-Archive `
            -LiteralPath (Join-Path $seed "Aurora-$env:AURORA_VERSION-Source.zip") `
            -DestinationPath $seed
          $sourceRoot = Join-Path $seed "Aurora-$env:AURORA_VERSION-Source"
          if (-not (Test-Path -LiteralPath (Join-Path $sourceRoot 'go.mod'))) {
            throw 'Source snapshot does not contain go.mod'
          }
          "AURORA_SOURCE_SEED=$(Join-Path $seed "Aurora-$env:AURORA_VERSION-Source.zip")" >> $env:GITHUB_ENV
          "AURORA_SOURCE_ROOT=$sourceRoot" >> $env:GITHUB_ENV

      - name: Audit exact source snapshot
        shell: pwsh
        run: |
          Push-Location $env:AURORA_SOURCE_ROOT
          try {
            & "$env:ProgramFiles\nodejs\node.exe" --check `
              'apps/windows/gui/frontend/dist/app.js'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & '.\scripts\test.ps1'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & '.\scripts\check-bindings.ps1'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & '.\scripts\check-mihomo-compatibility.ps1'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Build public Windows packages
        shell: pwsh
        run: |
          & "$env:AURORA_SOURCE_ROOT\scripts\build-windows-installer.ps1" `
            -Version $env:AURORA_VERSION
          $releaseDirectory = Join-Path $env:AURORA_SOURCE_ROOT `
            "build\windows\public\$env:AURORA_VERSION"
          $portableStage = Join-Path $env:RUNNER_TEMP 'aurora-portable'
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          New-Item -ItemType Directory -Force -Path $portableStage | Out-Null
          Copy-Item `
            -LiteralPath (Join-Path $env:AURORA_SOURCE_ROOT 'build\windows\Aurora-Setup-x64.exe') `
            -Destination (Join-Path $releaseDirectory "Aurora-$env:AURORA_VERSION-Setup-x64.exe")
          Copy-Item `
            -LiteralPath (Join-Path $env:AURORA_SOURCE_ROOT 'build\windows\Aurora.exe') `
            -Destination (Join-Path $portableStage 'Aurora.exe')
          Copy-Item `
            -LiteralPath (Join-Path $env:AURORA_SOURCE_ROOT 'README.md') `
            -Destination (Join-Path $portableStage 'README.md')
          Compress-Archive `
            -LiteralPath @(
              (Join-Path $portableStage 'Aurora.exe'),
              (Join-Path $portableStage 'README.md')
            ) `
            -DestinationPath (Join-Path $releaseDirectory "Aurora-$env:AURORA_VERSION-Portable-x64.zip") `
            -CompressionLevel Optimal
          "AURORA_RELEASE_DIRECTORY=$releaseDirectory" >> $env:GITHUB_ENV

      - name: Create self-contained corresponding source
        shell: pwsh
        run: |
          $packageStage = Join-Path $env:RUNNER_TEMP 'aurora-source-package'
          New-Item -ItemType Directory -Force -Path $packageStage | Out-Null
          Expand-Archive -LiteralPath $env:AURORA_SOURCE_SEED `
            -DestinationPath $packageStage
          $packageRoot = Join-Path $packageStage `
            "Aurora-$env:AURORA_VERSION-Source"
          go mod vendor -C $packageRoot
          $mihomoLicense = Join-Path (go env GOPATH) `
            'pkg\mod\github.com\metacubex\mihomo@v1.19.28\LICENSE'
          Copy-Item -LiteralPath $mihomoLicense `
            -Destination (Join-Path $packageRoot 'COPYING')
          $sourceArchive = Join-Path $env:RUNNER_TEMP `
            "Aurora-$env:AURORA_VERSION-Source.zip"
          tar -a -cf $sourceArchive `
            -C $packageStage `
            (Split-Path $packageRoot -Leaf)
          "AURORA_SOURCE_ARCHIVE=$sourceArchive" >> $env:GITHUB_ENV

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            (Join-Path $env:AURORA_RELEASE_DIRECTORY "Aurora-$env:AURORA_VERSION-Setup-x64.exe"),
            (Join-Path $env:AURORA_RELEASE_DIRECTORY "Aurora-$env:AURORA_VERSION-Portable-x64.zip"),
            $env:AURORA_SOURCE_ARCHIVE
          )
          $lines = $files | ForEach-Object {
            $file = Get-Item -LiteralPath $_
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content `
            -LiteralPath (Join-Path $env:AURORA_RELEASE_DIRECTORY 'SHA256SUMS.txt') `
            -Encoding ascii

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$env:AURORA_VERSION" `
            (Join-Path $env:AURORA_RELEASE_DIRECTORY "Aurora-$env:AURORA_VERSION-Setup-x64.exe") `
            (Join-Path $env:AURORA_RELEASE_DIRECTORY "Aurora-$env:AURORA_VERSION-Portable-x64.zip") `
            (Join-Path $env:AURORA_RELEASE_DIRECTORY 'SHA256SUMS.txt') `
            $env:AURORA_SOURCE_ARCHIVE `
            --repo '${{ github.repository }}' `
            --clobber
